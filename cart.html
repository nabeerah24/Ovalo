<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
 *
  {
    box-sizing: border-box;
  }
  body{
    margin: 0;
    padding: 0;
      background: #F5F3EF;
       font-family: 'Gill Sans', 'Gill Sans MT', sans-serif;
  }

  .navbar
{
display: flex;
flex-direction: row;
justify-content: space-between;
width: 100%;
}

.logo
{
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 8px;
    margin-left: -20px;
}
.logo img
{
    height: clamp(45px, 9vw, 70px);
    width: auto;
    object-fit: contain;
    
}
.nav-links
{
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    list-style: none;
    
    gap: clamp(12px, 2vw, 32px);
}
.nav-links li a
{
    color:#171717;
    font-size: clamp(1.5rem, 2vw, 1.5rem);
    text-decoration: none;
    position: relative;
}
.nav-links li a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0;
    height: 2px;
    background-color: #B08D57;
    transition: width 0.3s ease;
}

.nav-links li a:hover::after
{
    width: 100%;
}

.nav-icons
{
    display: flex;
    justify-content: center;
    align-items: center;
    gap:  clamp(18px, 8vw, 35px);
    margin-right: 22px;
}

.nav-icons i
{
    color: #171717;
}
.nav-icons i:hover
{
   color: #B08D57;
}
.mobile-icons
{
  display: none;
}
.search-box 
{
    display: none;
    position: absolute;
    top: 50px;
    right: 0;
    width: 280px;
    padding: 10px;
      background-color: transparent;
    border: none;
    /* box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15); */
    max-width: calc(100vw - 2rem); /* never overflow the viewport */
}
.search-box.active 
{
display: block;
}
#searchBar {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #3a291d;
    border-radius: 5px;
    background-color: rgb(63, 62, 62);
    color: white;
    font-size: 16px;
    outline: none;
}
#searchBar::placeholder {
    color: white;
}
/* =========================
   CART PAGE
========================= */

.cart-section {
    width: 100%;
    padding: 70px 6% 100px;
}

.cart-icon
{
    position: relative;
    display: inline-block;
}
#cart-count
{
    position: absolute;
    top: -12px;
    right: -10px;
    font-size: 12px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    background-color: red;
}
/* ---------- HEADING ---------- */

.cart-heading {
    text-align: center;
    margin-bottom: 50px;
}

.cart-heading h1 {
    margin: 0 0 10px;
    font-size: clamp(2rem, 4vw, 3rem);
    color: #171717;
}

.cart-heading p {
    margin: 0;
    color: #666;
    font-size: 1rem;
}


/* ---------- CART CONTAINER ---------- */

.cart-container {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 40px;
    max-width: 1200px;
    margin: auto;
    align-items: start;
}


/* ---------- CART ITEMS ---------- */

.cart-items {
    display: flex;
    flex-direction: column;
    gap: 20px;
}


/* ---------- SINGLE CART ITEM ---------- */

.cart-item {
    display: flex;
    align-items: center;
    gap: 25px;

    background-color: #ffffff;
    padding: 20px;

    border: 1px solid #e2ddd5;
    border-radius: 12px;

    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}


/* Product image */

.cart-item img {
    width: 120px;
    height: 120px;

    object-fit: contain;

    background-color: #F5F3EF;
    border-radius: 10px;

    padding: 10px;
}


/* Product information */

.cart-item-info {
    flex: 1;
}

.cart-item-info h3 {
    margin: 0 0 10px;

    font-size: 1.2rem;
    color: #171717;
}

.cart-item-price {
    margin: 0;

    font-size: 1rem;
    font-weight: 600;

    color: #B08D57;
}


/* ---------- REMOVE BUTTON ---------- */

.remove-btn {
    display: flex;
    align-items: center;
    gap: 8px;

    border: none;
    background: transparent;

    color: #8b3a3a;

    font-size: 0.9rem;

    cursor: pointer;

    padding: 8px;
}

.remove-btn:hover {
    color: #b02a2a;
}


/* ---------- CART SUMMARY ---------- */

.cart-summary {
    background-color: #ffffff;

    padding: 30px;

    border: 1px solid #e2ddd5;
    border-radius: 12px;

    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

    position: sticky;
    top: 30px;
}

.cart-summary h2 {
    margin: 0 0 25px;

    font-size: 1.5rem;
    color: #171717;
}


/* Summary rows */

.summary-line {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 0;

    border-bottom: 1px solid #e5e0d8;

    color: #555;
}


/* Total */

.total-line {
    border-bottom: none;

    padding-top: 20px;

    font-size: 1.15rem;
    font-weight: 700;

    color: #171717;
}


/* ---------- CHECKOUT BUTTON ---------- */

.checkout-btn {
    width: 100%;

    margin-top: 20px;

    padding: 14px 20px;

    border: none;
    border-radius: 6px;

    background-color: #171717;
    color: #F5F3EF;

    font-size: 1rem;
    font-weight: 600;

    cursor: pointer;

    transition: 0.3s ease;
}

.checkout-btn:hover {
    background-color: #B08D57;
    color: #171717;
}


/* ---------- CONTINUE SHOPPING ---------- */

.continue-shopping {
    display: block;

    margin-top: 20px;

    text-align: center;

    color: #171717;

    text-decoration: none;

    font-size: 0.95rem;
}

.continue-shopping:hover {
    color: #B08D57;
}


/* =========================
   EMPTY CART
========================= */

.empty-cart {
    text-align: center;

    background-color: #ffffff;

    padding: 60px 30px;

    border: 1px solid #e2ddd5;
    border-radius: 12px;

    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.empty-cart i {
    font-size: 3rem;

    color: #B08D57;

    margin-bottom: 20px;
}

.empty-cart h2 {
    margin: 10px 0;

    color: #171717;
}

.empty-cart p {
    color: #666;

    margin-bottom: 25px;
}

.empty-cart a {
    display: inline-block;

    padding: 12px 22px;

    background-color: #171717;
    color: #F5F3EF;

    border-radius: 6px;

    text-decoration: none;

    transition: 0.3s ease;
}

.empty-cart a:hover {
    background-color: #B08D57;
    color: #171717;
}



    /* Tablet */
@media (max-width: 768px) {
       .nav-links li a {
        font-size: 1rem; /* shrink text so it fits without wrapping */
    }

    .nav-links {
        gap: 14px; /* tighten spacing between links */
    }

    .nav-icons {
        gap: 12px;
        margin-right: 12px;
    }

    .logo img {
        height: 40px; /* slightly smaller logo to free up space */
    }
    .search-box {
        width: 240px;
        top: 45px;
    }
    #searchBar {
        padding: 10px 12px;
        font-size: 15px;
    }
     .cart-container {
        grid-template-columns: 1fr;
    }

    .cart-summary {
        position: static;
    }

}
    /* Mobile */
@media (max-width: 480px) {
      .navbar {
        padding: 16px 20px;
        align-items: center;
    }

    .logo img {
        height: 46px;
        margin-right: 15%;
    }

    .nav-icons {
        display: none; /* icons move inside the mobile menu instead */
    }

   .hamburger {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 28px;
    height: 20px;
    margin-right: 1%;
    cursor: pointer;
    z-index: 20;
}

.hamburger span {
    display: block;
    width: 100%;
    height: 3px;
    background-color: #171717; /* or whatever fits your dark mobile menu background */
    border-radius: 2px;
}
.nav-links.active ~ .hamburger span {
    background-color: #F5F3EF; /* light bars, visible on dark panel */
}
      .nav-links {
        position: fixed;
        top: 0;
        right: -100%; /* hidden off-screen by default */
        width: 65%;
        height: 110vh;
        background: #171717;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
        padding: 100px 40px 40px;
        gap: 24px;
        transition: right 0.35s ease;
        z-index: 15;
        overflow-y: auto;
        margin: 0;
    }
   
     .nav-links li a {
        font-size: 1.9rem;
        color: #F5F3EF;
    }
.nav-links.active {
     right: 0; /* slides in when toggled */
}

    .mobile-icons {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 20px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.15);
}

.mobile-icons a {
    display: flex;
    align-items: center;
    gap: 10px;
    color: antiquewhite;
    font-size: 1rem;
    text-decoration: none;
}

 .search-box {
        width: 90vw;         /* takes most of the screen width */
        right: 5vw;           /* keeps it roughly centered */
        left: 5vw;
        top: 40px;
        padding: 8px;
    }
    #searchBar {
        padding: 10px 12px;
        font-size: 14px;      /* avoid mobile Safari auto-zoom (needs 16px+, see note below) */
    }
    .mobile-search-box {
    display: none;
    margin-top: 10px;
    width: 100%;
}

.mobile-search-box.active {
    display: block;
}

.mobile-search-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #3a291d;
    border-radius: 5px;
    background-color: rgb(63, 62, 62);
    color: white;
    font-size: 16px;
    outline: none;
}

.mobile-search-box input::placeholder {
    color: white;
}
  .cart-section {
        padding: 45px 20px 70px;
    }

    .cart-heading {
        margin-bottom: 30px;
    }

    .cart-container {
        gap: 25px;
    }

    .cart-item {
        gap: 15px;
        padding: 15px;
    }

    .cart-item img {
        width: 85px;
        height: 85px;
    }

    .cart-item-info h3 {
        font-size: 1rem;
    }

    .cart-item-price {
        font-size: 0.9rem;
    }

    .remove-btn {
        font-size: 0;
    }

    .remove-btn i {
        font-size: 1rem;
    }

    .cart-summary {
        padding: 22px;
    }
  .mobile-cart-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

#mobile-cart-count {
    position: absolute;
    top: -10px;
    left: 25px;
    
    width: 16px;
    height: 16px;
    border-radius: 50%;
    
    background-color: red;
    color: white;
    font-size: 10px;
    
    display: flex;
    align-items: center;
    justify-content: center;
}
}
</style>
<body>
 <nav class="navbar">
            <div class="logo">
                <img src="uploads/logo-v1-no-bg.png" alt="">
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="home.html" class="nav-link" data-section="home">Home</a></li>
                <li><a href="shop.html" class="nav-link" data-section="shop">Shop</a></li>
                <li><a href="shop.html#shop-products" class="nav-link" data-section="categories">Categories</a></li>
                <li><a href="shop.html#new-arrivals" class="nav-link" data-section="new-arrivals">New Arrivals</a></li>
                <li><a href="about.html" class="nav-link" data-section="about">About</a></li>
                <li><a href="contact.html" class="nav-link" data-section="contact">Contact</a></li>
                
                 <li class="mobile-icons">
                    <div class="mobile-search">
                        <a href="#" id="mobileSearchLink"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
                        <div class="mobile-search-box">
                            <input type="text" placeholder="Search products">
                        </div>
                    </div>
        <a href="SignIn.html"><i class="fa-regular fa-user"></i> Account</a>
        <a href="cart.html" class="mobile-cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
             Cart
             <span id="mobile-cart-count"></span>
            </a>
                </li>
            </ul>

            <div class="nav-icons">

                <div class="search-container">
                    <a href="#" >
                        <i class="fa-solid fa-magnifying-glass search-icon" id="searchIcon"></i>
                    </a>
                    <div class="search-box">
                        <input type="text" id="searchBar" placeholder="Search products">
                    </div>
                </div>
                <a href="SignIn.html" class="account-icon">
                    <i class="fa-solid fa-user"></i>
                </a>
                <a href="cart.html" class="cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count"></span>
                </a>


            </div>

            <div class="hamburger" id="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
           </div>
        </nav>

        <section class="cart-section">

    <div class="cart-heading">
        <h1>Your Cart</h1>
        <p>Review your selected products before checkout.</p>
    </div>

    <div class="cart-container">

        <!-- PRODUCTS WILL APPEAR HERE -->
        <div class="cart-items" id="cartItems">
        </div>

        <!-- CART SUMMARY -->
        <div class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-line">
                <span>Subtotal</span>
                <span id="subtotal">Rs. 0</span>
            </div>

            <div class="summary-line">
                <span>Shipping</span>
                <span>Free</span>
            </div>

            <div class="summary-line total-line">
                <span>Total</span>
                <span id="total">Rs. 0</span>
            </div>

            <button class="checkout-btn">
                Proceed to Checkout
            </button>

            <a href="shop.html" class="continue-shopping">
                ← Continue Shopping
            </a>

        </div>

    </div>

</section>

     <script>
    function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('active');
    }

// x-x-x
const searchContainer = document.querySelector(".search-container");
const searchBox = document.querySelector(".search-box");


searchContainer.addEventListener("mouseenter", function() {
    searchBox.classList.add("active");
});

// both
document.addEventListener("click", function(event) {
    if (!searchContainer.contains(event.target)) {
        searchBox.classList.remove("active");
    }
});

const mobileSearchLink = document.getElementById("mobileSearchLink");
const mobileSearchBox = document.querySelector(".mobile-search-box");


// Open / close mobile search
mobileSearchLink.addEventListener("click", function(event) {

    event.preventDefault();

    mobileSearchBox.classList.toggle("active");

});


// ===============================
// CLOSE MOBILE MENU WHEN A LINK
// IS CLICKED
// ===============================

const mobileNavLinks = document.querySelectorAll(".nav-links > li > a");

mobileNavLinks.forEach(link => {

    link.addEventListener("click", function() {

        // Don't close menu when clicking mobile search
        if (link.id === "mobileSearchLink") {
            return;
        }

        document.getElementById("navLinks").classList.remove("active");

    });

});
// x-x-x-x-x

// CART

// GET CART FROM LOCAL STORAGE
let cart = JSON.parse(localStorage.getItem("cart")) || [];  //Get the cart from localStorage, convert it back into an array, and if nothing is there, use an empty array."

//CART COUNT
function updateCartCount() {
    const cartCount = document.getElementById("cart-count");
    const mobileCartCount = document.getElementById("mobile-cart-count");

    if (cart.length === 0) {
        cartCount.style.display = "none";
        mobileCartCount.style.display = "none";
    } else {
        cartCount.textContent = cart.length;
        mobileCartCount.textContent = cart.length;

        cartCount.style.display = "flex";
        mobileCartCount.style.display = "flex";
    }
}

updateCartCount();
//x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x

// DISPLAY CART

const cartItems = document.getElementById("cartItems");
const subtotal = document.getElementById("subtotal");
const total = document.getElementById("total");

function displayCart() {

    cartItems.innerHTML = "";       // So your first product does get cleared from the HTML, but then it is immediately added back, along with the second product.
    if (cart.length === 0) {
        cartItems.innerHTML = `
        <div class="empty-cart">
             <i class="fa-solid fa-cart-shopping"></i>

                <h2>Your cart is empty</h2>

                <p>You haven't added anything to your cart yet.</p>

                <a href="shop.html">
                    Continue Shopping
                </a>
        </div>
        `;
         subtotal.textContent = "$0";  
         total.textContent = "$0";  

        return;  //stop running the function right here
    }
    let totalPrice = 0; //abhi price 0 hai jab products add krenge to ye vary krega

       cart.forEach(function(product, index) { //forEach mn jo bhi hum sbse pehle likhte hain wo current item ko represent krta hai
                                               //this forEach would go through every product it has taken from localstorage   

            // Convert price from text into number

          let price = parseFloat(
    product.price
        .replace("$", "")
        .replace(",", "")
        .trim()
);
            totalPrice += price;  //the price of the product is added to totalPrice
            
                const item = document.createElement("div");

            item.classList.add("cart-item");
               item.innerHTML = `

                <img 
                    src="${product.image}" 
                    alt="${product.name}"
                >

                <div class="cart-item-info">

                    <h3>${product.name}</h3>

                    <p class="cart-item-price">
                        ${product.price}
                    </p>

                </div>
                    <button
                    class="remove-btn"
                    onclick="removeItem(${index})"
                >

                    <i class="fa-solid fa-trash"></i>

                    Remove

                </button>

            `;
                     // Add product to the page

            cartItems.appendChild(item);  //puts const = item inside cartItems

        });


        // ===============================
        // SHOW TOTAL
        // ===============================

        subtotal.textContent =
            "$ " + totalPrice.toLocaleString();  //puts totalPrice into the HTML element:subtotal

        total.textContent =
            "$ " + totalPrice.toLocaleString();

    }
//x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x-x

    // ===============================
    // REMOVE PRODUCT
    // ===============================

    function removeItem(index) {

        // Remove product from cart array

        cart.splice(index, 1);


        // Save updated cart

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

updateCartCount();

        // Display updated cart

        displayCart();

    }


    // ===============================
    // DISPLAY CART WHEN PAGE LOADS
    // ===============================

    displayCart();
</script>   
</body>
</html>
